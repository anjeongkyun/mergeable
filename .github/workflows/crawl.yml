name: refresh

on:
  schedule:
    - cron: "*/10 * * * *" # 목표 10분 (스케줄러 부하 시 지연될 수 있음)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - name: crawl
        run: npm run crawl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # jobs.json은 Actions에서 크롤하지 않는다 — 채용 소스가 Actions 데이터센터 IP를 스로틀해
      # 결과가 급감(예: 607→15)하기 때문. 로컬/주거 IP에서 `npm run crawl:jobs` 후 커밋하고,
      # Actions는 커밋된 public/jobs.json을 그대로 빌드·배포만 한다.
      - name: build
        run: npm run build
      - name: deploy
        run: npx wrangler pages deploy out --project-name=mergeable --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
